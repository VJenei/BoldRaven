<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#292831">
<title>Bold Raven</title>
<meta name="description" content="Look up a 6-digit NAICS code and see why that specific business needs each commercial insurance policy.">
<meta name="author" content="Vincent Jenei">

<!-- Every icon below is generated from icon/logo.png by make_logo.py. -->
<link rel="icon" href="icon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="icon/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Bold Raven">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="icon/site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:title" content="Bold Raven">
<meta property="og:description" content="Look up a 6-digit NAICS code and see why that specific business needs each commercial insurance policy.">
<meta property="og:image" content="icon/web-app-manifest-512x512.png">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="root-view" class="view">
  <img id="mark" src="icon/logo-mark.png" width="512" height="386" alt="" decoding="async">
  <h1 class="wordmark">BOLD RAVEN</h1>
  <div class="field-wrap">
    <input id="code-input"
           type="text"
           inputmode="numeric"
           maxlength="6"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"
           aria-label="NAICS code"
           autofocus>
    <span id="enter-hint" aria-hidden="true">&#8629;</span>
  </div>

  <footer class="credit">
    <span>Bold Raven</span>
    <span>&copy; 2026 Vincent Jenei</span>
    <span>All rights reserved</span>
  </footer>
</main>

<main id="code-view" class="view" hidden>
  <header class="code-head">
    <span id="code-number"></span>
    <h1 id="code-title"></h1>
  </header>

  <div class="code-body">
    <nav id="rail" aria-label="Policies"></nav>
    <section id="panel" tabindex="-1"></section>
  </div>

  <footer class="keys">
    <span><b>TAB</b> / <b>&#8592; &#8594;</b> POLICY</span>
    <span><b>1&#8211;8</b> JUMP</span>
    <span><b>ESC</b> RESET</span>
    <span class="keys-credit">&copy; 2026 Vincent Jenei</span>
  </footer>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
